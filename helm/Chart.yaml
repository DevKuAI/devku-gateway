type: application
version: 0.1.0
appVersion: "1.0.0"

keywords:
  - llm
  - ai
  - gateway
  - openai
  - anthropic
  - cohere
  - gemini
  - groq
  - xai
  - proxy

home: https://github.com/DevKuAI/devku-gateway
sources:
  - https://github.com/DevKuAI/devku-gateway

maintainers:
  - name: Gateway Team

dependencies:
  - name: redis
    version: "^24.0.0"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
